name: Code and production checks

on:
  workflow_dispatch:
    inputs:
      evaluate_production:
        description: Also check the deployed API (uses live provider quota)
        type: boolean
        default: false
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  regression-gate:
    name: Offline checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: offline-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Deterministic tests
        run: npm test
      - name: Long capture regressions
        run: npm run test:slow

      - name: Install pinned local database test engine
        run: npm install --prefix "$RUNNER_TEMP/cap-context-db-check" --no-audit --no-fund @electric-sql/pglite@0.5.8
      - name: Replay real SQL and verify telemetry contracts
        timeout-minutes: 5
        env:
          PGLITE_MODULE_PATH: ${{ runner.temp }}/cap-context-db-check/node_modules/@electric-sql/pglite
        run: node scripts/check-verified-telemetry-db.js
      - name: Install Brave for local browser fixtures
        run: |
          sudo curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends brave-browser xvfb
      - name: Installed Brave transfer, placement and draft checks (no AI calls)
        timeout-minutes: 3
        run: xvfb-run -a npm run test:extension-smoke

  production-evaluation:
    name: Live production summary check
    # This probes the deployed API, not the checked-out branch. Keep variable
    # provider quality visible without calling it a failure of every code push.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.evaluate_production)
    runs-on: ubuntu-latest
    # Two cases, at most two 320-second requests each, plus setup overhead.
    timeout-minutes: 25
    concurrency:
      group: live-production-summary
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Production accuracy and latency
        env:
          EVAL_REPORT_PATH: evaluation-report.json
        run: npm run eval
      - name: Retain both attempts and measured usage
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: production-evaluation
          path: evaluation-report.json
          if-no-files-found: error
          retention-days: 14
