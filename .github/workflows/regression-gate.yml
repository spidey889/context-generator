name: Production regression gate

on:
  workflow_dispatch:
  push:
    branches:
      - master
  schedule:
    - cron: "17 6 * * *"

jobs:
  regression-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run gate
