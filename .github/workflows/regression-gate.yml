name: Code and production checks

on:
  workflow_dispatch:
    inputs:
      evaluate_production:
        description: Also check the deployed API (uses live provider quota)
        type: boolean
        default: false
      extended_browser_checks:
        description: Run the additional platform, oversized-history and timing fixtures
        type: boolean
        default: false
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  regression-gate:
    name: Offline checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: offline-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Select checks from the complete change
        id: scope
        run: node scripts/ci-scope.js
      - name: Lightweight manifest, public site and scope checks
        if: steps.scope.outputs.mode == 'light'
        env:
          CI_BASE_SHA: ${{ steps.scope.outputs.base }}
        run: |
          git diff --check "$CI_BASE_SHA" "$GITHUB_SHA"
          node --test test/ci-scope.test.js test/license.test.js
      - name: Install locked test dependencies
        if: steps.scope.outputs.mode != 'light'
        run: npm ci --no-audit --no-fund
      - name: Code and SQL checks alongside Brave installation
        if: steps.scope.outputs.mode != 'light'
        shell: bash
        run: |
          mkdir -p .test-artifacts/ci-setup
          # Independent setup only: preserve test order and wait for both exits.
          (
            set -e
            echo "Running deterministic tests"
            npm test
            echo "Running long capture regressions"
            npm run test:slow
            echo "Replaying SQL and verifying telemetry contracts"
            timeout --kill-after=5s 300s node scripts/check-verified-telemetry-db.js
          ) > .test-artifacts/ci-setup/code.log 2>&1 &
          checks_pid=$!

          install_status=0
          timeout --kill-after=5s 120s bash -e -o pipefail -c '
            sudo curl --connect-timeout 10 --max-time 30 --retry 2 --retry-max-time 60 -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
            sudo curl --connect-timeout 10 --max-time 30 --retry 2 --retry-max-time 60 -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends brave-browser xvfb
          ' > .test-artifacts/ci-setup/brave-install.log 2>&1 || install_status=$?

          checks_status=0
          wait "$checks_pid" || checks_status=$?
          echo "::group::Code and SQL checks"
          cat .test-artifacts/ci-setup/code.log
          echo "::endgroup::"
          echo "::group::Brave installation"
          cat .test-artifacts/ci-setup/brave-install.log
          echo "::endgroup::"
          if (( checks_status != 0 || install_status != 0 )); then
            echo "::error::Code/SQL exit: $checks_status; Brave installation exit: $install_status"
            exit 1
          fi
      - name: Brave fixtures on two isolated displays
        if: steps.scope.outputs.mode != 'light'
        env:
          CI_EXTENDED_BROWSER_CHECKS: ${{ inputs.extended_browser_checks }}
        run: node scripts/run-ci-browser-checks.js
      - name: Browser failure screenshots and logs
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: |
            .test-artifacts/browser-smoke/
            .test-artifacts/ci-setup/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  production-evaluation:
    name: Live production summary check
    # This probes the deployed API, not the checked-out branch. Keep variable
    # provider quality visible without calling it a failure of every code push.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.evaluate_production)
    runs-on: ubuntu-latest
    # Two cases, at most two 320-second requests each, plus setup overhead.
    timeout-minutes: 25
    concurrency:
      group: live-production-summary
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Production accuracy and latency
        env:
          EVAL_REPORT_PATH: evaluation-report.json
        run: npm run eval
      - name: Retain both attempts and measured usage
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: production-evaluation
          path: evaluation-report.json
          if-no-files-found: error
          retention-days: 14
