name: Code and production checks

on:
  workflow_dispatch:
    inputs:
      evaluate_production:
        description: Also check the deployed API (uses live provider quota)
        type: boolean
        default: false
  push:
    branches:
      - master
      - "codex/**"
  pull_request:
    branches:
      - master
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  regression-gate:
    name: Offline checks
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    concurrency:
      group: offline-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Select checks from the complete change
        id: scope
        run: node scripts/ci-scope.js
      - name: Lightweight public site and scope checks
        if: steps.scope.outputs.mode == 'light'
        env:
          CI_BASE_SHA: ${{ steps.scope.outputs.base }}
        run: |
          git diff --check "$CI_BASE_SHA" "$GITHUB_SHA"
          node --test test/ci-scope.test.js test/license.test.js
      - name: Install locked test dependencies
        if: steps.scope.outputs.mode != 'light'
        run: npm ci --no-audit --no-fund
      - name: Deterministic tests
        if: steps.scope.outputs.mode != 'light'
        run: npm test
      - name: Long capture regressions
        if: steps.scope.outputs.mode != 'light'
        run: npm run test:slow

      - name: Replay real SQL and verify telemetry contracts
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 5
        run: node scripts/check-verified-telemetry-db.js
      - name: Install Brave for local browser fixtures
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 2
        run: |
          sudo curl --connect-timeout 10 --max-time 30 --retry 2 --retry-max-time 60 -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          sudo curl --connect-timeout 10 --max-time 30 --retry 2 --retry-max-time 60 -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends brave-browser xvfb
      - name: Brave DOM transfer, placement and local telemetry database
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_TELEMETRY_SMOKE: "1"
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/dom-telemetry
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR"
          xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/run.log"
      - name: Brave Copy to clipboard with DOM and Flash capture
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_COPY_SMOKE: "1"
          CAP_CONTEXT_TELEMETRY_SMOKE: "1"
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/copy
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/dom"
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR="$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/dom" \
            xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/dom/run.log"
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/flash"
          CAP_CONTEXT_JSON_SMOKE=chatgpt CAP_CONTEXT_SMOKE_ARTIFACT_DIR="$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/flash" \
            xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/flash/run.log"
      - name: Brave ChatGPT fast capture after reload and expired-token cancellation
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_JSON_SMOKE: chatgpt
          CAP_CONTEXT_CHATGPT_RELOAD_SMOKE: "1"
          CAP_CONTEXT_CHATGPT_AUTH_SMOKE: paste401
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/chatgpt-reload
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR"
          xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/run.log"
      - name: Brave ChatGPT oversized paste cancellation without DOM fallback
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_JSON_SMOKE: chatgpt
          CAP_CONTEXT_CHATGPT_FAILURE_SMOKE: paste-oversize
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/paste-budget
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR"
          xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/run.log"
      - name: Brave ChatGPT oversized history cancellation without DOM fallback
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_JSON_SMOKE: chatgpt
          CAP_CONTEXT_CHATGPT_FAILURE_SMOKE: history-oversize
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/chatgpt-history-budget
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR"
          xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/run.log"
      - name: Brave Claude CRLF pasted-card capture and partial fallback
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_JSON_SMOKE: "1"
          CAP_CONTEXT_CLAUDE_PARTIAL_SMOKE: "1"
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/claude-fallback
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/complete"
          CAP_CONTEXT_CLAUDE_PARTIAL_SMOKE="" CAP_CONTEXT_SMOKE_ARTIFACT_DIR="$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/complete" \
            xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/complete/run.log"
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR"
          xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/run.log"
      - name: Brave Claude oversized history cancellation and fallback
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_JSON_SMOKE: "1"
          CAP_CONTEXT_CLAUDE_PARTIAL_SMOKE: oversize
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/claude-oversize
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR"
          xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/run.log"
      - name: Brave Gemini bootstrap JSON capture and response-menu-free fallback
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_JSON_SMOKE: gemini
          CAP_CONTEXT_NETWORK_FAILURE_SMOKE: partial
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/gemini-capture
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/complete"
          CAP_CONTEXT_NETWORK_FAILURE_SMOKE="" CAP_CONTEXT_SMOKE_ARTIFACT_DIR="$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/complete" \
            xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/complete/run.log"
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR"
          xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/run.log"
      - name: Brave DeepSeek concurrent original-file capture
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_JSON_SMOKE: deepseek
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/deepseek-files
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR"
          xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/run.log"
      - name: Brave oversized history cancellation and fallback
        if: steps.scope.outputs.mode != 'light'
        timeout-minutes: 3
        shell: bash
        env:
          CAP_CONTEXT_JSON_SMOKE: deepseek
          CAP_CONTEXT_NETWORK_FAILURE_SMOKE: oversize
          CAP_CONTEXT_SMOKE_ARTIFACT_DIR: .test-artifacts/browser-smoke/history-budget
        run: |
          mkdir -p "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR"
          xvfb-run -a npm run test:extension-smoke 2>&1 | tee "$CAP_CONTEXT_SMOKE_ARTIFACT_DIR/run.log"
      - name: Browser failure screenshots and logs
        if: failure() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: .test-artifacts/browser-smoke/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  production-evaluation:
    name: Live production summary check
    # This probes the deployed API, not the checked-out branch. Keep variable
    # provider quality visible without calling it a failure of every code push.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.evaluate_production)
    runs-on: ubuntu-latest
    # Two cases, at most two 320-second requests each, plus setup overhead.
    timeout-minutes: 25
    concurrency:
      group: live-production-summary
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Production accuracy and latency
        env:
          EVAL_REPORT_PATH: evaluation-report.json
        run: npm run eval
      - name: Retain both attempts and measured usage
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: production-evaluation
          path: evaluation-report.json
          if-no-files-found: error
          retention-days: 14
