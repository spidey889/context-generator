<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="darkreader-lock">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Context Generator Analysis</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --panel: #111011;
      --panel-2: #171416;
      --line: rgba(236, 224, 207, 0.14);
      --line-strong: rgba(236, 224, 207, 0.25);
      --text: #f4efe8;
      --muted: #b9aea2;
      --soft: #867b72;
      --success: #78dba9;
      --plum: #d5a6dd;
      --gold: #e4c07a;
      --ivory: #f2e6d2;
      --shadow: 0 22px 60px rgba(0, 0, 0, 0.34);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 12% -10%, rgba(153, 105, 170, 0.22), transparent 31rem),
        radial-gradient(circle at 88% -8%, rgba(214, 169, 92, 0.17), transparent 30rem),
        linear-gradient(180deg, #171117 0%, #0c090b 28rem, var(--bg) 54rem),
        var(--bg);
      color: var(--text);
    }

    button {
      font: inherit;
    }

    .shell {
      width: min(1240px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .brand img {
      width: 38px;
      height: 38px;
      object-fit: contain;
      filter: drop-shadow(0 10px 22px rgba(213, 166, 221, 0.22));
    }

    .brand-text {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 720;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .brand-subtitle,
    .status {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.3;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(17, 14, 16, 0.82);
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 4px rgba(228, 192, 122, 0.12);
    }

    .dot.good {
      background: var(--success);
      box-shadow: 0 0 0 4px rgba(120, 219, 169, 0.12);
    }

    .dot.off {
      background: var(--soft);
      box-shadow: none;
    }

    .refresh {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--text);
      color: #171117;
      cursor: pointer;
      transition: background-color 150ms ease-out, transform 150ms ease-out;
    }

    .gear {
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: rgba(17, 14, 16, 0.82);
      color: var(--text);
      cursor: pointer;
      font-size: 17px;
      line-height: 1;
      transition: background-color 150ms ease-out, border-color 150ms ease-out;
    }

    .refresh:hover {
      background: var(--ivory);
    }

    .refresh:active {
      transform: translateY(1px);
    }

    .copy-details {
      width: 44px;
      padding: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    .refresh:focus-visible,
    .gear:focus-visible {
      outline: 3px solid rgba(228, 192, 122, 0.46);
      outline-offset: 2px;
    }

    .gear:hover,
    .gear[aria-expanded="true"] {
      background: rgba(255, 255, 255, 0.11);
    }

    .gear:disabled {
      opacity: 0.38;
      cursor: not-allowed;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.08fr) minmax(420px, 0.92fr);
      gap: 20px;
      align-items: stretch;
      min-height: clamp(520px, 68vh, 720px);
      margin-bottom: 18px;
    }

    .summary-band,
    .side-band,
    .metrics,
    .timeline {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(23, 20, 22, 0.96), rgba(12, 11, 12, 0.97));
      box-shadow: var(--shadow);
    }

    .summary-band {
      min-height: 254px;
      padding: 24px;
      display: grid;
      align-content: space-between;
      gap: 24px;
      overflow: hidden;
      position: relative;
      background:
        radial-gradient(circle at 12% 8%, rgba(213, 166, 221, 0.13), transparent 42%),
        linear-gradient(155deg, rgba(24, 20, 23, 0.98), rgba(10, 10, 10, 0.98));
    }

    .summary-band::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 3px;
      background: linear-gradient(90deg, var(--plum), var(--gold), var(--ivory));
    }

    .eyebrow {
      color: var(--plum);
      font-size: 12px;
      font-weight: 680;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 0;
      font-size: clamp(34px, 6vw, 68px);
      line-height: 0.96;
      letter-spacing: 0;
    }

    .route {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
      color: var(--muted);
      font-size: 14px;
    }

    .route strong {
      color: var(--text);
      font-size: 15px;
    }

    .arrow {
      color: var(--gold);
    }

    .hero-footer {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .mini {
      min-height: 72px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(6, 5, 6, 0.74);
    }

    .mini span,
    .metric span,
    .side-item span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .mini strong {
      display: block;
      margin-top: 8px;
      font-size: 20px;
      line-height: 1.05;
      overflow-wrap: anywhere;
    }

    .side-band {
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      grid-template-rows: auto minmax(120px, 0.75fr) minmax(280px, 1.6fr) minmax(110px, 0.75fr);
      gap: 10px;
    }

    .side-title {
      grid-column: 1 / -1;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 2px 2px 10px;
      border-bottom: 1px solid var(--line);
    }

    .side-title strong {
      font-size: 16px;
    }

    .side-title span {
      color: var(--muted);
      font-size: 13px;
      max-width: 62%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .side-item {
      display: grid;
      align-content: center;
      gap: 6px;
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(236, 224, 207, 0.12);
      border-radius: 7px;
      background: rgba(6, 5, 6, 0.58);
    }

    .side-item--fallback,
    .side-item--turns {
      grid-column: 1 / -1;
    }

    .side-item--fallback {
      background: rgba(228, 192, 122, 0.065);
      border-color: rgba(228, 192, 122, 0.2);
    }

    .side-item--fallback strong {
      font-size: 15px;
      line-height: 1.55;
      white-space: pre-line;
    }

    .side-item strong {
      font-size: 16px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 1px;
      margin-bottom: 18px;
      overflow: hidden;
      background: var(--line);
    }

    .metric {
      min-height: 136px;
      padding: 18px;
      background: #090909;
      display: grid;
      align-content: space-between;
      gap: 16px;
    }

    .metric strong {
      font-size: clamp(24px, 3.4vw, 38px);
      line-height: 1;
      letter-spacing: 0;
      overflow-wrap: anywhere;
    }

    .metric small {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .accent-teal strong { color: var(--ivory); }
    .accent-green strong { color: var(--gold); }
    .accent-amber strong { color: var(--plum); }
    .accent-coral strong { color: var(--ivory); }
    .accent-violet strong { color: var(--gold); }

    .timeline {
      padding: 20px;
      background: rgba(10, 9, 10, 0.96);
    }

    .raw-panel {
      margin-bottom: 18px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(10, 9, 10, 0.97);
      box-shadow: var(--shadow);
    }

    .raw-note {
      margin: -4px 0 14px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .raw-text {
      max-height: 68vh;
      margin: 0;
      padding: 16px;
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 8px;
      background: #070707;
      color: #e6ddd2;
      font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      user-select: text;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      margin-bottom: 14px;
    }

    .section-head h2 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .section-head span {
      color: var(--muted);
      font-size: 12px;
    }

    .timeline-list {
      display: grid;
      gap: 8px;
    }

    .step {
      display: grid;
      grid-template-columns: 140px minmax(0, 1fr) 96px;
      gap: 12px;
      align-items: center;
      min-height: 48px;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      background: rgba(6, 5, 6, 0.58);
    }

    .step-time {
      color: var(--gold);
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    .step-label {
      display: grid;
      gap: 5px;
      min-width: 0;
    }

    .step-label strong {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .chip {
      max-width: 100%;
      padding: 3px 6px;
      border-radius: 6px;
      background: rgba(213, 166, 221, 0.1);
      color: var(--muted);
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .step-total {
      color: var(--muted);
      text-align: right;
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }

    .empty {
      min-height: 340px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 38px;
      border: 1px dashed var(--line-strong);
      border-radius: 8px;
      background: rgba(12, 10, 11, 0.74);
      color: var(--muted);
    }

    .empty strong {
      display: block;
      margin-bottom: 8px;
      color: var(--text);
      font-size: 22px;
    }

    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .summary-band {
        min-height: 360px;
      }

      .side-band {
        grid-template-rows: auto;
      }

      .metrics {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 620px) {
      .shell {
        width: min(100vw - 20px, 1240px);
        padding-top: 18px;
      }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .actions {
        width: 100%;
        justify-content: space-between;
      }

      .hero-footer,
      .metrics {
        grid-template-columns: 1fr;
      }

      .side-band {
        grid-template-columns: 1fr;
      }

      .side-item--fallback,
      .side-item--turns {
        grid-column: auto;
      }

      .summary-band {
        padding: 18px;
      }

      .step {
        grid-template-columns: 1fr;
        gap: 6px;
      }

      .step-total {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <img src="../extension/bubble-icon.png" alt="">
        <div class="brand-text">
          <div class="brand-title">Context Generator</div>
          <div class="brand-subtitle">Analysis</div>
        </div>
      </div>
      <div class="actions">
        <div class="status" id="bridgeStatus"><span class="dot off"></span><span>Waiting</span></div>
        <button class="gear" id="rawScrapeButton" type="button" aria-label="Show raw scraped text" aria-expanded="false" title="Raw scraped text" disabled>&#9881;</button>
        <button class="refresh copy-details" id="copyDetailsButton" type="button" aria-live="polite" title="Copy all details" disabled>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="9" y="9" width="13" height="13" rx="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span class="visually-hidden" id="copyDetailsLabel">Copy all details</span>
        </button>
        <button class="refresh" id="refreshButton" type="button">Refresh</button>
      </div>
    </header>

    <div id="app" aria-live="polite"></div>
  </main>

  <script>
    const STORAGE_REQUEST_SOURCE = "context-generator-analysis-page";
    const STORAGE_BRIDGE_SOURCE = "context-generator-analysis-bridge";
    const app = document.getElementById("app");
    const bridgeStatus = document.getElementById("bridgeStatus");
    const rawScrapeButton = document.getElementById("rawScrapeButton");
    const copyDetailsButton = document.getElementById("copyDetailsButton");
    const copyDetailsLabel = document.getElementById("copyDetailsLabel");
    const copyDetailsIcon = copyDetailsButton.querySelector("svg");
    const copyDetailsIconPaths = copyDetailsIcon.innerHTML;
    const refreshButton = document.getElementById("refreshButton");
    const demoMode = new URLSearchParams(location.search).has("demo");
    const postTargetOrigin = location.protocol === "file:" || location.origin === "null" ? "*" : location.origin;
    // Reuse formatters across cards instead of constructing one per value.
    const numberFormatter = new Intl.NumberFormat("en-US");
    const dateFormatter = new Intl.DateTimeFormat("en-US", {
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit"
    });

    let bridgeReady = false;
    let rawScrapeOpen = false;
    let copyFeedbackTimer = null;

    function setCopyFeedback(label, paths = copyDetailsIconPaths) {
      copyDetailsLabel.textContent = label;
      copyDetailsButton.title = label;
      copyDetailsIcon.innerHTML = paths;
    }

    copyDetailsButton.addEventListener("click", async () => {
      if (copyDetailsButton.disabled) return;
      // Read only the displayed cards and timeline; never include the chat panel.
      const details = [...app.querySelectorAll(".mini, .side-item, .metric")].map((card) => {
        const [label, value, detail] = [...card.children].map((item) => item.textContent.trim());
        return `${label}: ${value}${detail ? ` (${detail})` : ""}`;
      });
      const timeline = [...app.querySelectorAll(".step")].map((step) => {
        const label = step.querySelector(".step-label > strong").textContent.trim();
        const delta = step.querySelector(".step-time").textContent.trim();
        const total = step.querySelector(".step-total").textContent.trim();
        const chips = [...step.querySelectorAll(".chip")].map((chip) => chip.textContent.trim());
        return `${label}: ${delta} (total: ${total})${chips.length ? `\n  ${chips.join("\n  ")}` : ""}`;
      });
      const report = [
        "Cap Context — Latest Run",
        `Total time: ${app.querySelector("h1").textContent.trim()}`,
        `Route: ${app.querySelector(".route").textContent.replace(/\s+/g, " ").trim()}`,
        `Receipt: ${app.querySelector(".side-title > span").textContent.trim()}`,
        "", ...details, "", `Timeline: ${timeline.length} marks`, ...timeline
      ].join("\n");
      clearTimeout(copyFeedbackTimer);
      try {
        try {
          await navigator.clipboard.writeText(report);
        } catch {
          // Local files and browsers with clipboard restrictions need the
          // user-initiated selection path instead of the Clipboard API.
          const field = document.createElement("textarea");
          field.value = report;
          field.setAttribute("readonly", "");
          field.style.cssText = "position:fixed;left:-9999px;top:0";
          document.body.appendChild(field);
          try {
            field.select();
            if (!document.execCommand("copy")) throw new Error("Copy unavailable");
          } finally {
            field.remove();
            copyDetailsButton.focus({ preventScroll: true });
          }
        }
        setCopyFeedback("Copied!", '<path d="m5 12 4 4L19 6"></path>');
      } catch {
        setCopyFeedback("Copy failed — try again", '<path d="m6 6 12 12M6 18 18 6"></path>');
      }
      copyFeedbackTimer = setTimeout(() => {
        setCopyFeedback("Copy all details");
      }, 2000);
    });

    rawScrapeButton.addEventListener("click", () => {
      if (rawScrapeButton.disabled) return;
      rawScrapeOpen = !rawScrapeOpen;
      updateRawScrapePanel();
    });

    refreshButton.addEventListener("click", () => {
      if (demoMode) {
        renderStats(getDemoStats());
        return;
      }
      requestStats();
    });

    window.addEventListener("message", (event) => {
      // The extension bridge owns storage access; this page consumes its messages.
      // A matching source name alone is insufficient without the window check.
      if (event.source !== window || event.data?.source !== STORAGE_BRIDGE_SOURCE) return;

      if (event.data.type === "BRIDGE_READY") {
        bridgeReady = true;
        setBridgeStatus("Connected", "good");
        requestStats();
      }

      if (event.data.type === "LAST_TRANSFER_STATS") {
        renderStats(event.data.payload);
      }
    });

    if (demoMode) {
      setBridgeStatus("Demo", "good");
      renderStats(getDemoStats());
    } else {
      requestStats();
      setTimeout(() => {
        if (!bridgeReady) {
          setBridgeStatus("Offline", "off");
          renderStats(null);
        }
      }, 900);
    }

    function requestStats() {
      window.postMessage({
        source: STORAGE_REQUEST_SOURCE,
        type: "REQUEST_LAST_TRANSFER_STATS"
      }, postTargetOrigin);
    }

    function renderStats(stats) {
      if (!stats) {
        copyDetailsButton.disabled = true;
        rawScrapeOpen = false;
        rawScrapeButton.disabled = true;
        rawScrapeButton.setAttribute("aria-expanded", "false");
        app.innerHTML = `
          <section class="empty">
            <div>
              <strong>No transfer receipt yet</strong>
              <span>The next completed Cap-Context run will appear here.</span>
            </div>
          </section>
        `;
        return;
      }

      copyDetailsButton.disabled = false;
      const capture = stats.capture || {};
      const summary = stats.summary || {};
      const usage = summary.usage || {};
      const localCarry = summary.source === "local";
      const integrity = getIntegrityLabel(summary.requestChars, summary.backendInputChars);
      const rawText = typeof stats.rawScrapedText === "string" ? stats.rawScrapedText : "";
      const cacheHit = summary.cacheHit === true || summary.source === "cache";
      const usageDetail = cacheHit
        ? `${formatNumber(usage.promptTokens)} in / ${formatNumber(usage.completionTokens)} out from original generation`
        : `${formatNumber(usage.promptTokens)} in / ${formatNumber(usage.completionTokens)} out`;
      const summaryTimingDetail = cacheHit
        ? `Cache hit; original ${formatBackendLabel(summary)}: ${formatDuration(summary.originalSummaryMs)}`
        : `${formatBackendLabel(summary)}: ${formatDuration(summary.providerMs)}`;

      app.innerHTML = `
        <section class="hero">
          <div class="summary-band">
            <div>
              <div class="eyebrow">Latest run</div>
              <h1>${escapeHtml(formatDuration(stats.totalMs))}</h1>
              <div class="route">
                <strong>${escapeHtml(stats.source?.name || "Source")}</strong>
                <span class="arrow">-></span>
                <strong>${escapeHtml(stats.destination?.name || "Destination")}</strong>
                <span>${escapeHtml(formatDate(stats.completedAt))}</span>
              </div>
            </div>
            <div class="hero-footer">
              ${mini("Status", stats.status === "completed" ? "Completed" : "Failed")}
              ${mini("Served model", formatModelDisplayName(summary.model))}
              ${mini("Profile", summary.profile || "n/a")}
            </div>
          </div>

          <aside class="side-band">
            <div class="side-title">
              <strong>Receipt</strong>
              <span>${escapeHtml(stats.transferId || "")}</span>
            </div>
            ${sideItem("Input check", integrity)}
            ${sideItem("Served by", formatBackendLabel(summary))}
            ${sideItem("Model path", getModelFallbackLabel(summary), "fallback")}
            ${sideItem("Message turns", formatTurnSummary(capture), "turns")}
            ${sideItem("Capture notes", formatCaptureDiagnostics(capture), "turns")}
          </aside>
        </section>

        <section class="metrics">
          ${metric("Raw found", formatNumber(capture.rawCandidateChars), "Candidate message characters", "accent-teal")}
          ${metric("Scraped", formatNumber(capture.cleanedChars), formatTurnSummary(capture), "accent-green")}
          ${metric("Sent", formatNumber(capture.sentChars), capture.capped ? `Capped at ${formatNumber(capture.capChars)}; ${formatNumber(capture.usefulTurnCount)} turns captured` : `${formatNumber(capture.usefulTurnCount)} turns captured/sent`, "accent-amber")}
          ${metric(localCarry ? "Local input" : "Backend got", formatNumber(summary.backendInputChars), localCarry ? "Carry prepared in this browser" : `Request: ${formatNumber(summary.requestChars)}`, "accent-coral")}
          ${metric("Summary", formatNumber(summary.outputChars), `${formatNumber(summary.summaryWordCount)} words`, "accent-violet")}
          ${metric("Tokens", formatNumber(usage.totalTokens), usageDetail, "accent-green")}
          ${metric("Summary time", formatDuration(summary.summaryMs), summaryTimingDetail, "accent-amber")}
          ${metric(stats.destination?.id === "clipboard" ? "Clipboard time" : "Paste time", formatDuration(stats.destinationTiming?.pasteMs), stats.destination?.id === "clipboard" ? "Context written to clipboard" : `Page: ${formatDuration(stats.destinationTiming?.pageLoadMs)} · Composer wait: ${formatDuration(stats.destinationTiming?.composerWaitMs)}`, "accent-teal")}
        </section>

        <section class="raw-panel" id="rawScrapePanel" hidden>
          <div class="section-head">
            <h2>Raw scraped text</h2>
            <span>${escapeHtml(formatNumber(rawText.length))} characters</span>
          </div>
          <p class="raw-note">Exact latest captured transcript used for this transfer. Stored locally for 24 hours or until the next transfer.</p>
          <pre class="raw-text" id="rawScrapedText"></pre>
        </section>

        <section class="timeline">
          <div class="section-head">
            <h2>Timeline</h2>
            <span>${escapeHtml(formatNumber(stats.timeline?.length || 0))} marks</span>
          </div>
          <div class="timeline-list">
            ${(stats.timeline || []).map(timelineStep).join("")}
          </div>
        </section>
      `;

      const rawScrapedText = document.getElementById("rawScrapedText");
      // Keep captured markup literal rather than inserting it as HTML.
      // Raw transcripts must also stay outside the copied receipt details.
      if (rawScrapedText) rawScrapedText.textContent = rawText;
      rawScrapeButton.disabled = !rawText;
      if (!rawText) rawScrapeOpen = false;
      updateRawScrapePanel();
    }

    function updateRawScrapePanel() {
      const panel = document.getElementById("rawScrapePanel");
      rawScrapeButton.setAttribute("aria-expanded", rawScrapeOpen ? "true" : "false");
      rawScrapeButton.setAttribute("aria-label", rawScrapeOpen ? "Hide raw scraped text" : "Show raw scraped text");
      if (panel) panel.hidden = !rawScrapeOpen;
    }

    function mini(label, value) {
      return `<div class="mini"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`;
    }

    function sideItem(label, value, modifier = "") {
      const modifierClass = modifier ? ` side-item--${modifier}` : "";
      return `<div class="side-item${modifierClass}"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || "n/a")}</strong></div>`;
    }

    function metric(label, value, detail, accent) {
      return `
        <div class="metric ${accent}">
          <span>${escapeHtml(label)}</span>
          <strong>${escapeHtml(value)}</strong>
          <small>${escapeHtml(detail)}</small>
        </div>
      `;
    }

    function timelineStep(step) {
      const chips = Object.entries(step.detail || {})
        .filter(([, value]) => value !== null && value !== undefined && value !== "")
        .slice(0, 5)
        .map(([key, value]) => `<span class="chip">${escapeHtml(key)}: ${escapeHtml(formatDetailValue(value))}</span>`)
        .join("");

      return `
        <div class="step">
          <div class="step-time">+${escapeHtml(formatDuration(step.deltaMs))}</div>
          <div class="step-label">
            <strong>${escapeHtml(step.label)}</strong>
            <div class="chips">${chips}</div>
          </div>
          <div class="step-total">${escapeHtml(formatDuration(step.totalMs))}</div>
        </div>
      `;
    }

    function setBridgeStatus(text, tone) {
      bridgeStatus.innerHTML = `<span class="dot ${tone || ""}"></span><span>${escapeHtml(text)}</span>`;
    }

    function getIntegrityLabel(sent, received) {
      if (sent === null || sent === undefined || received === null || received === undefined) return "Unknown";
      return Number(sent) === Number(received) ? "Complete - all sent text received" : "Mismatch - some text may be missing";
    }

    function getModelFallbackLabel(summary) {
      if (!summary) return "n/a";
      const tried = Array.isArray(summary.modelsTried) ? summary.modelsTried.filter(Boolean) : [];
      const servedModel = summary.model || null;
      // Older receipts can contain model IDs this page no longer recognizes.
      // Preserve the warning rather than inventing a label for an unknown route.
      if ((servedModel && formatModelDisplayName(servedModel) === "n/a")
        || tried.some((model) => formatModelDisplayName(model) === "n/a")) {
        return "Not recorded - run a new transfer";
      }
      if ((summary.fallback?.used || tried.length > 1) && servedModel) {
        // Only attempts before the served model belong in the failure list.
        const servedIndex = tried.lastIndexOf(servedModel);
        const failedModels = servedIndex >= 0 ? tried.slice(0, servedIndex) : tried;
        return [
          "Tried this run",
          ...failedModels.map((model) => `${formatModelDisplayName(model)} — failed`),
          `${formatModelDisplayName(servedModel)} — served`
        ].join("\n");
      }

      if (tried.length === 1) return `${formatModelDisplayName(tried[0])} served first\nNo fallback needed`;
      if (["tiny", "direct"].includes(summary.profile) && servedModel === "local-direct" && !summary.fallback?.used) {
        return "Local carry served\nNo provider model needed";
      }
      if (summary.servedBy === "local-direct") return "Local fallback served\nNo provider model needed";
      return "Not recorded - run a new transfer";
    }

    function formatModelDisplayName(model) {
      if (model === "qwen/qwen3.8-27b:free") return "Qwen3.8 27B";
      if (model === "dots-studio/dots-3-note-preview:free") return "Dots3-Note Preview";
      if (model === "google/gemma-4-26b-a4b-it:free") return "Gemma 4 26B A4B";
      if (model === "inclusionai/ling-3.1-flash") return "Space Bunny 2";
      if (model === "gemini-3.6-flash") return "Gemini 3.6 Flash";
      if (model === "gemini-3.5-flash-lite") return "Gemini 3.5 Flash-Lite";
      if (model === "ministral-14b-2512") return "Ministral 3 14B";
      if (model === "local-direct") return "Local carry";
      return "n/a";
    }

    function formatBackendLabel(summary) {
      const provider = summary?.servedBy || summary?.provider;
      if (provider === "openrouter") return "OpenRouter";
      if (provider === "gemini") return "Google Gemini";
      if (provider === "mistral") return "Mistral";
      if (provider === "local-direct") return "Local";
      return "n/a";
    }

    function formatCaptureDiagnostics(capture) {
      const diagnostics = capture.diagnostics;
      if (!diagnostics) return "Not recorded - run a new transfer";
      // Only known categories become labels; never echo arbitrary receipt values.
      // Uploads intentionally have no visible label in the capture notes.
      const labels = { media: "images/audio/video", tools: "tool output", artifacts: "artifacts", other: "other unsupported content" };
      const reasons = { unavailable: "Fast capture unavailable", timeout: "Fast capture timed out", size_limit: "Fast capture exceeded a size limit", incomplete: "Conversation response incomplete", unsupported: "Unsupported content in fast capture", request_failed: "Native history request failed" };
      const lines = [];
      // The fallback mark precedes DOM capture, which can itself fail.
      if (Object.hasOwn(reasons, diagnostics.jsonFallbackReason)) lines.push(`${reasons[diagnostics.jsonFallbackReason]}; ${capture.method ? "used" : "tried"} normal capture`);
      const types = Array.isArray(diagnostics.excludedContentTypes)
        ? Object.keys(labels).filter(type => diagnostics.excludedContentTypes.includes(type)) : null;
      if (types === null) lines.push("Excluded types not recorded");
      else if (types.length) lines.push(`Skipped: ${types.map(type => labels[type]).join(", ")}`);
      else if (!diagnostics.excludedContentTypes.length) lines.push("No excluded types recorded");
      lines.push("Separate editor-only changes are not checked");
      return lines.join("\n");
    }

    function formatTurnSummary(capture) {
      return `${formatNumber(capture.messageTurnCount)} detected / ${formatNumber(capture.usefulTurnCount)} captured/sent`;
    }

    function formatNumber(value) {
      if (value === null || value === undefined || value === "") return "n/a";
      const number = Number(value);
      if (!Number.isFinite(number)) return "n/a";
      return numberFormatter.format(number);
    }

    function formatDuration(value) {
      if (value === null || value === undefined || value === "") return "n/a";
      const ms = Number(value);
      if (!Number.isFinite(ms)) return "n/a";
      if (ms < 1000) return `${Math.round(ms)}ms`;
      if (ms < 60000) return `${(ms / 1000).toFixed(ms < 10000 ? 1 : 0)}s`;
      const minutes = Math.floor(ms / 60000);
      const seconds = Math.round((ms % 60000) / 1000);
      return `${minutes}m ${seconds}s`;
    }

    function formatDate(value) {
      if (!value) return "";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";
      return dateFormatter.format(date);
    }

    function formatDetailValue(value) {
      if (typeof value === "number") return formatNumber(value);
      if (typeof value === "boolean") return value ? "yes" : "no";
      if (typeof value === "object") return JSON.stringify(value);
      return String(value);
    }

    function escapeHtml(value) {
      // Escape ampersands first so newly added entities are not escaped again.
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function getDemoStats() {
      return {
        transferId: "demo-7n2",

        source: { name: "Claude" },

        capture: {

        },
        summary: {

        timeline: [
          { label: "click", deltaMs: 0, totalMs: 0, detail: { source: "Cap-Context button" } },

          { label: "capture done", deltaMs: 240, totalMs: 252, detail: { sentChars: 48142, messageTurnCount: 32 } },
          { label: "summary start", deltaMs: 20, totalMs: 272, detail: { inputChars: 48142 } },

      };
    }
